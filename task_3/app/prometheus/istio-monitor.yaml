apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-proxy-monitor
  namespace: monitoring
spec:
  namespaceSelector:
    any: true

  selector:
    matchExpressions:
    - key: security.istio.io/tlsMode
      operator: Exists

  podMetricsEndpoints:
  - path: /stats/prometheus
    port: http-envoy-prom
    interval: 15s